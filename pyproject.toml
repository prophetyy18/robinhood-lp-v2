[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robinhood-lp-v2"
version = "0.1.0"
description = "Uniswap V4 LP research on Robinhood Chain"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
prophet = "tools.prophet.__main__:main"
robinhood-lp-v2-probe = "robinhood_lp_v2.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robinhood_lp_v2"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "ARG", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately spell out protocol values: asserting CHAIN_ID == 4663 is
# the point. PLR2004 would rewrite that into the constant it is checking.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
