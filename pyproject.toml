[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "robinhood-lp-v2"
version = "0.1.0"
description = "Uniswap V4 LP research on Robinhood Chain"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
keywords = ["uniswap", "v4", "liquidity", "market-making", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# keccak256 for canonical PoolId derivation. The pycryptodome backend is
# small, pure-Python-importable, and matches the Ethereum spec. Note that
# hashlib.sha3_256 is SHA3, not keccak256, and the two disagree.
dependencies = [
  "pycryptodome>=3.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
prophet = "tools.prophet.__main__:main"
robinhood-lp-v2-probe = "robinhood_lp_v2.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robinhood_lp_v2"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
  "--tb=short",
]
# An xfail that starts passing is a failure: the test no longer describes a
# real gap, and leaving it marked lets the gap reopen unnoticed.
xfail_strict = true
# A warning that nobody reads is a warning nobody acts on. Turn them into
# errors so a new DeprecationWarning fails the gate instead of scrolling past.
filterwarnings = [
  "error",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/robinhood_lp_v2"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
# No floor yet. The MVP phase measures first and then sets a number it can
# actually hold; a threshold nobody believes gets ignored, then lowered.

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "RUF",  # ruff-specific
  "PL",   # pylint
]
ignore = [
  "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately spell out protocol values: asserting CHAIN_ID == 4663 is
# the point. PLR2004 would rewrite that into the constant it is checking.
"tests/*" = ["PLR2004"]
# A CLI entry point is a wrapper; a docstring on main() adds nothing.
"src/*/__main__.py" = ["D103"]
# tools/prophet/ is vendored from prophet-workflow and is replaced wholesale
# when the template moves. Holding it to this project's lint rules would mean
# editing vendored code on every bump, which is how copies drift out of sync.
# Its own gates run in the template repository.
"tools/prophet/*" = ["PLR0912", "PLR2004", "PLR5501", "PLW2901", "RUF002", "RUF103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
# mypy with no target silently succeeds, which is worse than not running it.
files = ["src", "tools"]
mypy_path = "src"
# A listed-but-unused config is a stale instruction; a used-but-obsolete one
# is worse. Neither is worth leaving behind.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# third-party libraries return Any at first contact; banning it outright only
# produces casts in places that never needed them.
disallow_any_explicit = false
no_implicit_optional = true
check_untyped_defs = true
